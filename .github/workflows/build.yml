name: Happy Little Train — production print pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      seed:
        description: Deterministic illustration seed
        required: false
        default: '24001'
        type: string
      preview_only:
        description: Generate artwork and reports without rendering the print PDF
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: happy-little-train-print
  cancel-in-progress: false

jobs:
  content-audit:
    name: Content integrity audit
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Audit all 24 bilingual pages
        run: python -m book.content_check

  artwork-audit:
    name: Generate original vector artwork and audit assets
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate 24 deterministic original SVG illustrations
        run: python -m book.agents.orchestrator --generate-art --build-epub --build-site --seed "${{ github.event.inputs.seed || '24001' }}"
      - name: Audit 24 original vector/raster page illustrations
        run: python -m book.inputs --report dist/artwork-preflight.json
      - name: Upload generated artwork and diagnostics
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: happy-little-train-generated-artwork
          path: |
            assets/artwork/*.svg
            dist/artwork-preflight.json
            dist/swarm/
            dist/publish/
            dist/site/
          if-no-files-found: error
          retention-days: 14
      - name: Upload artwork diagnostics even when the gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: happy-little-train-artwork-preflight
          path: dist/artwork-preflight.json
          if-no-files-found: warn
          retention-days: 14

  epubcheck:
    name: Validate EPUB with official W3C EPUBCheck
    needs: [artwork-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download generated EPUB artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: happy-little-train-generated-artwork
          path: .
      - name: Verify Java runtime
        run: java -version
      - name: Download and verify EPUBCheck 5.4.0 from its GitHub release
        run: |
          curl --fail --location --retry 2 \
            https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip \
            --output /tmp/epubcheck-5.4.0.zip
          echo "33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c  /tmp/epubcheck-5.4.0.zip" | sha256sum --check
          mkdir -p /tmp/epubcheck
          unzip -q /tmp/epubcheck-5.4.0.zip -d /tmp/epubcheck
      - name: Validate EPUB 3.4 conformance
        run: |
          EPUBCHECK_JAR="$(find /tmp/epubcheck -name epubcheck.jar -type f -print -quit)"
          test -n "$EPUBCHECK_JAR"
          java -jar "$EPUBCHECK_JAR" dist/publish/the-happy-little-train.epub

  render-and-preflight:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.preview_only != true }}
    name: Render, validate and package print PDF
    needs: [content-audit, artwork-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download generated artwork and swarm reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: happy-little-train-generated-artwork
          path: .

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install native rendering stack and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            shared-mime-info fontconfig fonts-noto-core fonts-dejavu-core \
            qpdf poppler-utils
          fc-match "Noto Naskh Arabic"
          fc-match "Noto Sans"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Render print PDF with WeasyPrint/Pango
        run: python -m book.render

      - name: Structural and bilingual PDF preflight
        run: |
          python -m book.preflight dist/the-happy-little-train-print.pdf
          qpdf --check dist/the-happy-little-train-print.pdf
          pdfinfo dist/the-happy-little-train-print.pdf

      - name: Build KDP paperback full-wrap cover
        run: python -m book.cover --pages 24

      - name: Render visual proof images
        run: |
          mkdir -p dist/proof
          pdftoppm -r 90 -png dist/the-happy-little-train-print.pdf dist/proof/page
          python - <<'PY'
          from pathlib import Path
          pages = list(Path("dist/proof").glob("page-*.png"))
          assert len(pages) == 24, f"Expected 24 proof images, got {len(pages)}"
          print(f"Rendered {len(pages)} page proofs.")
          PY

      - name: Upload validated print PDF and proof images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: happy-little-train-print-ready
          path: |
            dist/the-happy-little-train-print.pdf
            dist/the-happy-little-train-cover.pdf
            dist/cover-preflight.json
            dist/proof/
            dist/swarm/
          if-no-files-found: error
          retention-days: 30


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [render-and-preflight]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated print artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: happy-little-train-print-ready
          path: dist
      - name: Publish tagged GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/the-happy-little-train-print.pdf
          generate_release_notes: true
