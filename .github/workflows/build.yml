name: Build bilingual children's book

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

concurrency:
  group: build-print-book
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          # DejaVu Sans is distributed under a permissive open font license
          # and includes Arabic glyphs; arabic-reshaper + python-bidi shape RTL text.

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate and validate PDF
        run: |
          python generate_book.py
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          pdf = Path("dist/the-happy-little-train-print.pdf")
          reader = PdfReader(str(pdf))
          assert len(reader.pages) == 24, f"Expected 24 pages, got {len(reader.pages)}"
          box = reader.pages[0].mediabox
          expected = (8.625 * 72, 8.75 * 72)
          assert abs(float(box.width) - expected[0]) < 0.2
          assert abs(float(box.height) - expected[1]) < 0.2
          print(f"Validated {len(reader.pages)} pages; {float(box.width):.2f} x {float(box.height):.2f} pt")
          PY

      - name: Upload print PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: happy-little-train-print-pdf
          path: dist/the-happy-little-train-print.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated PDF to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/the-happy-little-train-print.pdf
          if git diff --cached --quiet; then
            echo "Generated PDF is unchanged; nothing to commit."
          else
            git commit -m "Build print-ready bilingual children's book PDF"
            # Rebase if another source commit lands while the PDF is being built.
            git pull --rebase origin main
            git push
          fi
