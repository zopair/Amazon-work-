name: Happy Little Train — production print pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: happy-little-train-print
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install native rendering stack and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            shared-mime-info fontconfig fonts-noto-core fonts-dejavu-core \
            qpdf poppler-utils
          fc-match "Noto Naskh Arabic"
          fc-match "Noto Sans"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate original artwork inputs (hard gate)
        run: python -m book.inputs --report dist/artwork-preflight.json

      - name: Upload artwork diagnostics even when the gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happy-little-train-artwork-preflight
          path: dist/artwork-preflight.json
          if-no-files-found: warn
          retention-days: 14

      - name: Render print PDF with WeasyPrint/Pango
        run: python -m book.render

      - name: Structural and bilingual PDF preflight
        run: |
          python -m book.preflight dist/the-happy-little-train-print.pdf
          qpdf --check dist/the-happy-little-train-print.pdf
          pdfinfo dist/the-happy-little-train-print.pdf

      - name: Render visual proof images
        run: |
          mkdir -p dist/proof
          pdftoppm -r 90 -png dist/the-happy-little-train-print.pdf dist/proof/page
          python - <<'PY'
          from pathlib import Path
          pages = list(Path("dist/proof").glob("page-*.png"))
          assert len(pages) == 24, f"Expected 24 proof images, got {len(pages)}"
          print(f"Rendered {len(pages)} page proofs.")
          PY

      - name: Upload validated print PDF and proof images
        uses: actions/upload-artifact@v4
        with:
          name: happy-little-train-print-ready
          path: |
            dist/the-happy-little-train-print.pdf
            dist/proof/
            dist/artwork-preflight.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/the-happy-little-train-print.pdf
          generate_release_notes: true
