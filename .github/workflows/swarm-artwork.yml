name: Generate deterministic book artwork

on:
  push:
    branches: [feature/deterministic-swarm-phase-3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-artwork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate story, scene plan and 24 SVG illustrations
        run: python -m book.agents.orchestrator --generate-art --build-epub --build-site
      - name: Run standard-library artwork and contract tests
        run: python -m unittest discover -s tests -v
      - name: Upload vector artwork and generation reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: happy-little-train-vector-artwork
          path: |
            assets/artwork/*.svg
            dist/swarm/
            dist/publish/
            dist/site/
          if-no-files-found: error
          retention-days: 14
